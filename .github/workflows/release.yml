name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        name: Validate tag and application version
        run: python scripts/prepare-release.py

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    needs: [prepare, checks]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macOS-universal
            filename: Tele2Local-1.0.0-macOS-universal.dmg
            bundle: dmg
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            artifact: Windows-x64
            filename: Tele2Local-1.0.0-Windows-x64.exe
            bundle: nsis
            path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - name: Build installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          tauriScript: tauri
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Name platform package
        shell: bash
        run: |
          python - <<'PYTHON'
          import glob, pathlib, shutil
          files = glob.glob('${{ matrix.path }}')
          assert len(files) == 1, files
          pathlib.Path('release-assets').mkdir()
          shutil.copyfile(files[0], 'release-assets/${{ matrix.filename }}')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: Tele2Local-1.0.0-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: release-assets/${{ matrix.filename }}

  publish:
    name: Publish 1.0.0
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: Tele2Local-1.0.0-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py release-assets
