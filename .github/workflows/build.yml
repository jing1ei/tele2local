name: Build
# Automatic release builds.
#
# - Pushing a version tag (e.g. v1.2.3) runs the checks, builds the signed-off
#   release packages, and publishes a GitHub Release for that exact version.
# - "Run workflow" builds the same packages and keeps them as downloadable
#   workflow artifacts without touching any release.
#
# The per-commit rolling 1.0.0 pipeline lives in release.yml; this workflow is
# for discrete version tags and on-demand builds.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a tagged release build midway; manual builds may be superseded.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        name: Validate tag and application version
        run: python scripts/prepare-release.py

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    needs: [prepare, checks]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macOS-universal
            bundle: dmg
            glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            artifact: Windows-x64
            bundle: nsis
            glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: build-${{ matrix.target }}
      - name: Build release package
        shell: bash
        run: tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundle }}' -- --locked
      - name: Stage versioned package
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          ext=dmg
          if [ '${{ matrix.bundle }}' = 'nsis' ]; then ext=exe; fi
          # Intentionally unquoted so the pattern is expanded and the result
          # asserted to be exactly one package.
          files=(${{ matrix.glob }})
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one ${{ matrix.bundle }} package, found: ${files[*]:-none}" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${files[0]}" "release-assets/Tele2Local-${version}-${{ matrix.artifact }}.${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: Tele2Local-${{ needs.prepare.outputs.version }}-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: release-assets/

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Tele2Local-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: release-assets
      - name: Verify and checksum packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected both release packages, got: ${files[*]:-none}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            [ -s "$f" ] || { echo "Empty artifact: $f" >&2; exit 1; }
          done
          ( cd release-assets && sha256sum -- * > SHA256SUMS.txt )
          echo "Produced:"; ls -1 release-assets
      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          tag="v${version}"
          notes="$(mktemp)"
          {
            echo "Tele2Local ${version}."
            echo
            echo "- **macOS 11+ (Apple silicon & Intel):** \`Tele2Local-${version}-macOS-universal.dmg\`"
            echo "- **Windows 10/11 x64:** \`Tele2Local-${version}-Windows-x64.exe\`"
            echo
            echo "Builds are unsigned. On macOS, after moving Tele2Local to Applications:"
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine /Applications/Tele2Local.app'
            echo '```'
            echo
            echo '`SHA256SUMS.txt` lists the checksum of every asset.'
          } > "$notes"
          # A hyphen in the version (v1.2.3-rc1) marks a prerelease and keeps it
          # from becoming the "latest" release.
          latest_flags=(--latest)
          case "$version" in
            *-*) latest_flags=(--prerelease --latest=false);;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Tele2Local ${version}" --notes-file "$notes" "${latest_flags[@]}"
          else
            gh release create "$tag" --title "Tele2Local ${version}" --notes-file "$notes" \
              --target "$GITHUB_SHA" "${latest_flags[@]}"
          fi
          gh release upload "$tag" release-assets/* --clobber
